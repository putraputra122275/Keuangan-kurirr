      tx:S.tx,

function localLoad(){
  try{
    let all=JSON.parse(
      localStorage.getItem(
        'keuangan_pengusaha_accounts'
      )||'null'
    );

    if(Array.isArray(all)&&all.length){
      S.accounts=all;

      let last=localStorage.getItem(
        'keuangan_pengusaha_last_account'
      );

      let idx=all.findIndex(
        x=>String(x.p?.id)===String(last)
      );

      loadCurrent(idx>=0?idx:0);

      return true;
    }
  }catch(_){}

  return false;
}

async function getAuthUser(){
  if(!sb)return null;

  try{
    let q=await sb.auth.getSession();

    if(q.data?.session)
      return q.data.session.user;

    let a=await sb.auth.signInAnonymously();

    if(a.error)
      throw a.error;

    return a.data.user;
  }catch(_){
    return null;
  }
}

async function cloudLoad(user){
  if(!sb||!user)return false;

  try{
    let q=await sb
      .from('keuangan_accounts')
      .select('*')
      .eq('owner_id',user.id)
      .order('created_at',{ascending:true});

    if(q.error)return false;

    let accounts=q.data||[];
    let out=[];

    for(const a of accounts){

      let [t,r]=await Promise.all([

        sb
          .from('keuangan_transactions')
          .select('*')
          .eq('account_id',a.id)
          .order('created_at',{ascending:false}),

        sb
          .from('keuangan_quick_items')
          .select('*')
          .eq('account_id',a.id)
          .order('created_at',{ascending:true})

      ]);

      if(t.error||r.error)
        return false;

      out.push({
        p:{
          id:a.id,
          nama_kurir:a.nama,
          nama_usaha:a.nama_usaha,
          nomor_whatsapp:a.nomor_telepon,
          alamat_lengkap:a.alamat_lengkap,
          latitude:a.latitude,
          longitude:a.longitude,
          jenis_penghasilan:a.jenis_penghasilan,
          jenis_usaha:a.jenis_usaha,
          saldo_awal:Number(a.saldo_awal||0),
          saldo:Number(a.saldo||0)
        },

        tx:(t.data||[]).map(x=>({
          id:x.id,
          jenis:x.jenis,
          keterangan:x.keterangan,
          nominal:Number(x.nominal),
          created_at:x.created_at
        })),

        quick:(r.data||[]).map(x=>({
          id:x.id,
          name:x.name,
          amount:Number(x.amount)
        }))
      });
    }

    if(out.length){
      S.accounts=out;

      let last=localStorage.getItem(
        'keuangan_pengusaha_last_account'
      );

      let idx=out.findIndex(
        x=>String(x.p.id)===String(last)
      );

      loadCurrent(
        idx>=0?idx:out.length-1
      );

      localSave();

      return true;
    }

  }catch(_){}

  return false;
}

/* =========================================================
   PERBAIKAN HALAMAN KOSONG
   ========================================================= */

async function init(){

  // Tampilkan aplikasi terlebih dahulu agar kegagalan/lambatnya API
  // tidak membuat halaman kosong.
  const hasLocal=localLoad();

  if(hasLocal){
    S.screen='dash';
    render();
  }else{
    S.screen='start';
    render();
  }

  // Supabase dijalankan di belakang layar.
  // Jika gagal atau lambat, tampilan aplikasi tetap berjalan.
  try{

    const authPromise=getAuthUser();

    const timeout=new Promise(
      resolve=>setTimeout(
        ()=>resolve(null),
        8000
      )
    );

    S.user=await Promise.race([
      authPromise,
      timeout
    ]);

    if(S.user){

      const loadPromise=cloudLoad(S.user);

      const loadTimeout=new Promise(
        resolve=>setTimeout(
          ()=>resolve(false),
          8000
        )
      );

      const loaded=await Promise.race([
        loadPromise,
        loadTimeout
      ]);

      if(loaded){
        S.screen='dash';
        render();
      }
    }

  }catch(_){

    // Jangan biarkan gangguan API menghentikan aplikasi.
  }
}

    style="margin-top:7px">

function locate(){

  let z=document.getElementById('ls');

  if(!navigator.geolocation){

    z.textContent=
      'Browser tidak mendukung lokasi.';

    return;
  }

  z.textContent=
    'Meminta izin lokasi...';

  navigator.geolocation.getCurrentPosition(

    p=>{

      S.loc={
        lat:p.coords.latitude,
        lng:p.coords.longitude
      };

      z.textContent=
        'Lokasi berhasil dibagikan.';
    },

    ()=>{
      z.textContent=
        'Lokasi belum berhasil dibagikan. Izinkan lokasi pada browser lalu coba lagi.';
    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}


/* =========================================================
   SELESAI REGISTRASI
   ========================================================= */

async function finish(){

  let n=document.getElementById('rn').value.trim();
  let u=document.getElementById('ru').value.trim();
  let t=document.getElementById('rt').value.trim();
  let a=document.getElementById('ra').value.trim();

  if(!n||!u||!t||!a)
    return alert(
      'Lengkapi semua data pendaftaran.'
    );


  if(S.changing){

    let old=S.p;
    let oldTx=S.tx;
    let oldQuick=S.quick;
    let oldSaldo=bal();

    S.p={
      ...old,
      nama_kurir:n,
      nama_usaha:u,
      nomor_whatsapp:t,
      alamat_lengkap:a,
      latitude:S.loc.lat??old.latitude,
      longitude:S.loc.lng??old.longitude,
      jenis_penghasilan:S.reg.cat,
      jenis_usaha:S.reg.biz
    };

    let net=oldTx.reduce(
      (z,x)=>
        z+
        (
          x.jenis==='pemasukan'
          ?Number(x.nominal)
          :-Number(x.nominal)
        ),
      0
    );

    S.p.saldo_awal=
      oldSaldo-net;

    S.p.saldo=
      oldSaldo;

    S.accounts[S.current]={
      p:S.p,
      tx:oldTx,
      quick:oldQuick
    };

    localSave();

    await cloudAccountUpsert();

    S.changing=false;
    S.screen='dash';

    render();

    return;
  }


  let id=
    'local-'+crypto.randomUUID();

  let p={
    id,
    nama_kurir:n,
    nama_usaha:u,
    nomor_whatsapp:t,
    alamat_lengkap:a,
    latitude:S.loc.lat,
    longitude:S.loc.lng,
    jenis_penghasilan:S.reg.cat,
    jenis_usaha:S.reg.biz,
    saldo_awal:0,
    saldo:0
  };

  if(!S.user)
    S.user=await getAuthUser();

  S.accounts.push({
    p,
    tx:[],
    quick:[]
  });

  loadCurrent(
    S.accounts.length-1
  );

  localSave();


  if(S.user&&sb){

    let realId=
      crypto.randomUUID();

    p.id=realId;

    S.accounts[S.current].p=p;
    S.p=p;

    localSave();

    await cloudAccountUpsert();
  }

  S.adding=false;
  S.screen='dash';

  render();
}

    nominal:Number(a),
    created_at:new Date().toISOString()

/* =========================================================
   RIWAYAT
   ========================================================= */

function history(type){

  let arr=
    S.tx.filter(
      t=>t.jenis===type
    );

  let groups={};

  arr.forEach(t=>{

    let k=
      dateKey(t.created_at);

    (groups[k]??=[]).push(t);

  });


  let rows=
    Object.entries(groups)
    .sort(
      (a,b)=>
        b[0].localeCompare(a[0])
    )
    .map(
      ([k,v])=>{

        let total=
          v.reduce(
            (n,t)=>
              n+Number(t.nominal),
            0
          );

        return `
        <button
          class="option"
          style="margin-bottom:5px;display:flex;justify-content:space-between;align-items:center"
          onclick="openHistoryDate('${type}','${k}')">

          <span>
          ${dateLabel(v[0].created_at)}
          </span>

          <b>
          ${rup(total)} ›
          </b>

        </button>`;
      }
    ).join('');


  A.innerHTML=`

  <main class="page">

  <button
    class="back"
    onclick="S.screen='${type==='pemasukan'?'in':'out'}';render()">
    ← Kembali
  </button>

  <div class="card">

  <h2>
  ${type==='pemasukan'
    ?'RIWAYAT PEMASUKAN'
    :'RIWAYAT PENGELUARAN'}
  </h2>

  ${
    rows||
    '<div class="empty">Belum ada riwayat.</div>'
  }

  </div>

  </main>`;
}


function openHistoryDate(type,key){

  S.historyType=type;
  S.historyDate=key;

  S.screen='hdetail';

  render();
}


/* =========================================================
   DETAIL RIWAYAT
   ========================================================= */

function historyDetail(){

  let type=S.historyType;
  let key=S.historyDate;

  let arr=
    S.tx.filter(
      t=>
        t.jenis===type&&
        dateKey(t.created_at)===key
    );

  let label=
    arr[0]
    ?dateLabel(arr[0].created_at)
    :key;

  let total=
    arr.reduce(
      (n,t)=>
        n+Number(t.nominal),
      0
    );


  A.innerHTML=`

  <main class="page">

  <button
    class="back"
    onclick="S.screen='${type==='pemasukan'?'hin':'hout'}';render()">
    ← Daftar Tanggal
  </button>


  <div class="card">

  <h2>
  ${type==='pemasukan'
    ?'PEMASUKAN'
    :'PENGELUARAN'}

  <div class="notice">
    ${label}
  </div>


  ${
    arr.map(t=>
      `<div class="history">

      <div class="historytop">

      <div class="itemname">
      ${e(t.keterangan)}
      </div>

      <div class="${type==='pemasukan'?'in':'out'}">
      ${type==='pemasukan'?'+':'-'}
      ${rup(t.nominal)}
      </div>

      </div>

      <button
        class="btn small danger"
        onclick="delTx('${e(t.id)}')">
        HAPUS
      </button>

      </div>`
    ).join('')
  }


  <div
    class="balance"
    style="padding:10px 0">

    <small>
    Total
    ${type==='pemasukan'
      ?'Pemasukan'
      :'Pengeluaran'}
    </small>

    ${rup(total)}

  </div>

  </div>

  </main>`;
}


async function delTx(id){

  let t=
    S.tx.find(
      x=>String(x.id)===String(id)
    );

  if(
    !t||
    !confirm(
      'Hapus transaksi ini? Saldo akan disesuaikan.'
    )
  )
    return;

  if(
    !(await cloudTxDelete(t.id))
  )
    return alert(
      'Transaksi tidak dapat dihapus dari database.'
    );

  S.tx=
    S.tx.filter(
      x=>String(x.id)!==String(id)
    );

  S.p.saldo=bal();

  localSave();

  await cloudAccountUpsert();

  render();
}

async function saveEdit(){

  let n=
    document.getElementById('en')
    .value.trim();

  let u=
    document.getElementById('eu')
    .value.trim();

  let t=
    document.getElementById('et')
    .value.trim();

  let a=
    document.getElementById('ea')
    .value.trim();

  let ns=
    Number(
      document.getElementById('esaldo')
      .value
    );


  if(
    !n||
    !u||
    !t||
    !a||
    Number.isNaN(ns)||
    ns<0
  )
    return alert(
      'Semua data harus diisi dengan benar.'
    );


  let net=
    S.tx.reduce(
      (z,x)=>
        z+
        (
          x.jenis==='pemasukan'
          ?Number(x.nominal)
          :-Number(x.nominal)
        ),
      0
    );


  Object.assign(
    S.p,

      nama_usaha:u,
      nomor_whatsapp:t,
      alamat_lengkap:a,
      saldo_awal:ns-net,

  );


  localSave();

  await cloudAccountUpsert();

  alert(

/* =========================================================
   PERBAIKAN STARTUP
   =========================================================

   Bagian ini menggantikan:

   window.addEventListener('load',init);

   supaya aplikasi tidak bergantung pada event load.
   ========================================================= */

try{

  if(document.readyState==='loading'){

    document.addEventListener(
      'DOMContentLoaded',
      ()=>{
        try{
          init();
        }catch(_){
          S.screen='start';
          render();
        }
      },
      {once:true}
    );

  }else{

    init();

  }

}catch(_){

  try{
    S.screen='start';
    render();
  }catch(__){}

}
